name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Zip plugin
        id: zip
        run: |
          version=$(node -p "require('./package.json').version")
          stage=$(mktemp -d)
          mkdir "$stage/decky-toolkit"
          cp -r dist plugin.json package.json main.py LICENSE README.md defaults py_modules static "$stage/decky-toolkit/"
          (cd "$stage" && zip -qrX "$GITHUB_WORKSPACE/decky-toolkit-$version.zip" decky-toolkit -x '*/__pycache__/*')
          echo "file=decky-toolkit-$version.zip" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: ${{ steps.zip.outputs.file }}
          if-no-files-found: error

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: ./scripts/test.sh

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run smoke
      - run: pnpm run package
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: extension/*.vsix
          if-no-files-found: error
