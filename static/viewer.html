<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decky-MCP Screen</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #d7dbe0; font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 6px 10px; background: #15181d; border-bottom: 1px solid #262a31; flex-wrap: wrap; }
  header b { color: #fff; }
  .stat { font-variant-numeric: tabular-nums; color: #9aa3ad; }
  .stat span { color: #e8ecf0; }
  button { background: #262a31; color: #e8ecf0; border: 1px solid #353a43; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #30353e; }
  button.on { background: #2d6cdf; border-color: #2d6cdf; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; position: relative; }
  img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  main.actual img { max-width: none; max-height: none; }
  main.actual { overflow: auto; align-items: flex-start; justify-content: flex-start; }
  #msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(20,22,26,.9); padding: 12px 16px; border-radius: 6px; max-width: 80%; white-space: pre-wrap; }
  #msg[hidden] { display: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; display: inline-block; margin-right: 4px; }
  .dot.live { background: #3ddc84; }
  .settings { position: relative; }
  #pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; display: grid; grid-template-columns: auto auto; gap: 6px 10px; align-items: center; padding: 10px 12px; background: #15181d; border: 1px solid #353a43; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.5); white-space: nowrap; }
  #pop label { color: #9aa3ad; }
  #pop select { background: #262a31; color: #e8ecf0; border: 1px solid #353a43; border-radius: 4px; padding: 3px 6px; }
  #pop .note { grid-column: 1 / -1; color: #9aa3ad; font-size: 12px; min-height: 1.4em; }
  .input-ctl { display: inline-flex; align-items: center; gap: 6px; }
  #pop[hidden], .input-ctl[hidden], .seg[hidden], #pad-ind[hidden] { display: none; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 4px 0 0 4px; }
  .seg button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #pad-ind, #inp-note { color: #9aa3ad; font-size: 12px; }
  main.capturing { outline: 2px solid #2d6cdf; outline-offset: -2px; }
  main.capturing img { cursor: crosshair; }
  main:focus { outline: none; }
  main.capturing:focus { outline: 2px solid #2d6cdf; }
</style>
</head>
<body>
<header>
  <b><span class="dot" id="dot"></span>Decky-MCP Screen</b>
  <span class="stat">fps <span id="fps">–</span></span>
  <span class="stat">Mbps <span id="mbps">–</span></span>
  <span class="stat">res <span id="res">–</span></span>
  <span class="stat">frames <span id="frames">0</span></span>
  <span style="flex:1"></span>
  <span class="settings" id="settings" hidden>
    <button id="gear" title="Stream settings (device-wide)" aria-expanded="false">⚙ Stream</button>
    <div id="pop" hidden>
      <label for="s-fps">Frame rate</label>
      <select id="s-fps" data-key="fps"><option value="15">15 fps</option><option value="24">24 fps</option><option value="30">30 fps</option><option value="60">60 fps</option></select>
      <label for="s-quality">JPEG quality</label>
      <select id="s-quality" data-key="quality"><option value="50">50</option><option value="60">60</option><option value="70">70</option><option value="80">80</option><option value="90">90</option></select>
      <label for="s-width">Size</label>
      <select id="s-width" data-key="width"><option value="0">Native</option><option value="1600">1600 px</option><option value="1280">1280 px</option><option value="960">960 px</option><option value="640">640 px</option></select>
      <span class="note" id="s-note">Applies to every viewer.</span>
    </div>
  </span>
  <span class="input-ctl" id="input-ctl" hidden>
    <span id="pad-ind" hidden>🎮 connected</span>
    <span id="inp-note"></span>
    <span class="seg" id="mode" hidden>
      <button id="mode-ui" class="on" title="Clicks and moves map onto the screen; click the picture to capture the keyboard">UI</button>
      <button id="mode-game" title="Pointer lock: relative mouse for games (Esc releases)">Game</button>
    </span>
    <button id="inp" title="Remote keyboard, mouse and gamepad input (device-wide)">⌨ Input</button>
  </span>
  <button id="pause">Pause</button>
  <button id="fit" class="on">Fit</button>
  <button id="snap">Snapshot</button>
  <button id="full">Fullscreen</button>
</header>
<main id="main" tabindex="-1">
  <img id="img" alt="Deck display">
  <div id="msg">Connecting…</div>
</main>
<script>
(() => {
  const img = document.getElementById('img'), msg = document.getElementById('msg'), dot = document.getElementById('dot');
  const el = id => document.getElementById(id);
  let paused = false, abort = null, frames = 0, lastUrl = null;
  let win = []; // [time, bytes] for the last 2 s
  let applying = false, applyTimer = null;

  const show = t => { msg.textContent = t; msg.hidden = !t; };

  function stats(bytes) {
    const now = performance.now();
    win.push([now, bytes]);
    while (win.length && now - win[0][0] > 2000) win.shift();
    el('fps').textContent = (win.length / 2).toFixed(1);
    el('frames').textContent = ++frames;
    if (frames % 10 === 0) el('mbps').textContent = (win.reduce((a, [, b]) => a + b, 0) * 8 / 2 / 1e6).toFixed(1);
  }

  function present(buf) {
    const url = URL.createObjectURL(new Blob([buf], { type: 'image/jpeg' }));
    img.onload = () => { if (lastUrl) URL.revokeObjectURL(lastUrl); lastUrl = url; el('res').textContent = img.naturalWidth + '×' + img.naturalHeight; };
    img.src = url;
  }

  // Parse the multipart/x-mixed-replace stream ourselves so we can count frames and bytes.
  async function run() {
    abort = new AbortController();
    try {
      const res = await fetch('/stream.mjpeg', { signal: abort.signal, cache: 'no-store' });
      if (res.status === 401) { show('Unauthorized. Reload this page to request access again.'); return; }
      if (!res.ok || !res.body) { show('Stream error ' + res.status + ': ' + await res.text()); return; }
      show(''); dot.classList.add('live');
      const reader = res.body.getReader();
      let buf = new Uint8Array(0);
      const dec = new TextDecoder();
      const concat = (a, b) => { const c = new Uint8Array(a.length + b.length); c.set(a); c.set(b, a.length); return c; };
      const indexOf = (hay, needle, from) => { outer: for (let i = from; i <= hay.length - needle.length; i++) { for (let j = 0; j < needle.length; j++) if (hay[i + j] !== needle[j]) continue outer; return i; } return -1; };
      const CRLF2 = [13, 10, 13, 10];
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf = concat(buf, value);
        while (true) {
          const h = indexOf(buf, CRLF2, 0);
          if (h < 0) break;
          const head = dec.decode(buf.subarray(0, h));
          const m = /content-length:\s*(\d+)/i.exec(head);
          if (!m) { buf = buf.subarray(h + 4); continue; }
          const len = +m[1], start = h + 4;
          if (buf.length < start + len) break;
          const frame = buf.slice(start, start + len);
          buf = buf.subarray(start + len);
          stats(len);
          if (applying === 'sent') doneApplying('');
          if (!paused) present(frame);
        }
      }
      show(applying ? 'Applying stream settings…' : 'Stream ended. Reconnecting…');
    } catch (e) {
      if (e.name !== 'AbortError') show(applying ? 'Applying stream settings…' : 'Disconnected: ' + e.message + '\nReconnecting…');
    }
    dot.classList.remove('live');
    if (!abort.signal.aborted) setTimeout(run, 1500);
  }

  // Stream settings live on the server (one capture pipeline for everyone), so nothing is stored here.
  const selects = [...document.querySelectorAll('#pop select')];
  function fill(st) {
    for (const sel of selects) {
      const v = String(st[sel.dataset.key]);
      if (![...sel.options].some(o => o.value === v)) sel.add(new Option(v + (sel.dataset.key === 'fps' ? ' fps' : ''), v));
      sel.value = v;
    }
  }
  function doneApplying(note) {
    applying = false; clearTimeout(applyTimer);
    selects.forEach(s => s.disabled = false);
    el('s-note').textContent = note || 'Applies to every viewer.';
  }
  async function apply(sel) {
    applying = 'pending'; selects.forEach(s => s.disabled = true);
    el('s-note').textContent = 'Applying…';
    try {
      const res = await fetch('/stream/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [sel.dataset.key]: +sel.value }) });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'HTTP ' + res.status);
      fill(await res.json());
      // The pipeline has restarted by the time PUT returns, so the next frame comes from the new one.
      applying = 'sent';
      applyTimer = setTimeout(() => doneApplying(''), 6000);
    } catch (e) {
      doneApplying('Failed: ' + e.message);
      loadSettings();
    }
  }
  async function loadSettings() {
    try {
      const res = await fetch('/stream/settings', { cache: 'no-store' });
      if (!res.ok) return; // older server without the endpoint: keep the controls hidden
      fill(await res.json());
      el('settings').hidden = false;
    } catch (e) { /* hidden */ }
  }
  selects.forEach(sel => sel.onchange = () => apply(sel));
  const togglePop = open => { el('pop').hidden = !open; el('gear').classList.toggle('on', open); el('gear').setAttribute('aria-expanded', open); };
  el('gear').onclick = e => { e.stopPropagation(); togglePop(el('pop').hidden); };
  el('pop').onclick = e => e.stopPropagation();
  document.addEventListener('click', () => togglePop(false));

  el('pause').onclick = () => { paused = !paused; el('pause').textContent = paused ? 'Resume' : 'Pause'; el('pause').classList.toggle('on', paused); };
  el('fit').onclick = () => { const fit = el('main').classList.toggle('actual'); el('fit').classList.toggle('on', !fit); el('fit').textContent = fit ? 'Actual' : 'Fit'; };
  el('snap').onclick = () => window.open('/frame.jpg?t=' + Date.now(), '_blank');
  el('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : el('main').requestFullscreen();
  document.addEventListener('keydown', e => { if (capturing()) return; if (e.key === 'Escape') togglePop(false); if (e.target.tagName === 'SELECT') return; if (e.key === ' ') { e.preventDefault(); el('pause').click(); } if (e.key === 'f') el('full').click(); });

  // ---- remote input ----
  const main = el('main');
  let inp = null, ws = null, wsRetry = null, mode = 'ui', focusSize = [1920, 1080];
  const heldKeys = new Set(), heldButtons = new Set();
  let pendingMove = null, relX = 0, relY = 0, moveFrame = 0, wheelAcc = 0;
  const wsOpen = () => ws && ws.readyState === WebSocket.OPEN;
  const send = m => { if (wsOpen()) ws.send(JSON.stringify(m)); };
  const locked = () => document.pointerLockElement === main;
  // Keys are only captured while the picture has focus (click it); toolbar clicks give them back.
  function capturing() { return !!(inp && inp.enabled && wsOpen() && (document.activeElement === main || locked())); }
  const note = t => { el('inp-note').textContent = t || ''; };

  function releaseAll() {
    for (const k of heldKeys) send({ type: 'key', key: k, down: false });
    for (const b of heldButtons) send({ type: 'mouse_button', button: b, down: false });
    heldKeys.clear(); heldButtons.clear();
    if (padSent) { send({ type: 'gamepad', ...NEUTRAL_PAD }); padSent = null; }
    send({ type: 'release_all' });
  }

  function applyInput(st) {
    inp = st;
    const b = el('inp');
    b.classList.toggle('on', st.enabled);
    b.textContent = st.enabled ? '⌨ Input on' : '⌨ Input';
    b.disabled = !st.available;
    b.title = st.available ? (st.enabled ? 'Remote input is on (' + st.backend + '). Click to turn it off for every client.' : 'Turn on remote keyboard, mouse and gamepad input (device-wide)') : (st.reason || 'Input unavailable');
    el('mode').hidden = !st.enabled;
    if (st.enabled) connectWs(); else { closeWs(); note(''); }
    updateCapture();
  }
  async function loadInput() {
    try {
      const res = await fetch('/input/settings', { cache: 'no-store' });
      if (!res.ok) return; // older server: keep the input controls hidden
      el('input-ctl').hidden = false;
      applyInput(await res.json());
    } catch (e) { /* hidden */ }
  }
  el('inp').onclick = async () => {
    if (!inp) return;
    el('inp').disabled = true;
    try {
      const res = await fetch('/input/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: !inp.enabled }) });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'HTTP ' + res.status);
      applyInput(await res.json());
    } catch (e) { note('Failed: ' + e.message); el('inp').disabled = false; }
  };

  function connectWs() {
    if (ws) return;
    clearTimeout(wsRetry);
    const sock = ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/input');
    sock.onopen = () => { note(''); updateCapture(); };
    sock.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.type === 'state') { focusSize = m.focus_size || focusSize; if (!m.enabled) loadInput(); }
      else if (m.type === 'error') { note(m.message); console.warn('input:', m.message); }
    };
    sock.onclose = ev => {
      if (ws !== sock) return;
      ws = null; heldKeys.clear(); heldButtons.clear(); padSent = null;
      if (locked()) document.exitPointerLock();
      updateCapture();
      if (ev.code === 4003) { note(ev.reason || 'Input refused'); loadInput(); return; }
      if (inp && inp.enabled) wsRetry = setTimeout(connectWs, 1500);
    };
  }
  function closeWs() { clearTimeout(wsRetry); if (ws) { releaseAll(); const s = ws; ws = null; s.close(); } updateCapture(); }

  function updateCapture() { main.classList.toggle('capturing', capturing()); }
  main.addEventListener('focus', updateCapture);
  main.addEventListener('blur', () => { if (!locked()) releaseAll(); updateCapture(); });
  window.addEventListener('blur', () => { releaseAll(); updateCapture(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

  for (const [id, m] of [['mode-ui', 'ui'], ['mode-game', 'game']]) el(id).onclick = () => {
    mode = m; el('mode-ui').classList.toggle('on', m === 'ui'); el('mode-game').classList.toggle('on', m === 'game');
    if (m === 'ui' && locked()) document.exitPointerLock();
    note(m === 'game' ? 'Click the picture to lock the pointer; Esc releases it.' : '');
  };

  // Map a client point onto the picture, allowing for object-fit: contain letterboxing.
  function norm(e) {
    const r = img.getBoundingClientRect(), nw = img.naturalWidth || 1920, nh = img.naturalHeight || 1080;
    const scale = Math.min(r.width / nw, r.height / nh);
    const offX = (r.width - nw * scale) / 2, offY = (r.height - nh * scale) / 2;
    const clamp = v => Math.min(1, Math.max(0, v));
    return [clamp((e.clientX - r.left - offX) / (nw * scale)), clamp((e.clientY - r.top - offY) / (nh * scale))];
  }
  function flushMove() {
    moveFrame = 0;
    if (pendingMove) { send({ type: 'mouse_move', x: +pendingMove[0].toFixed(5), y: +pendingMove[1].toFixed(5) }); pendingMove = null; }
    if (relX || relY) { send({ type: 'mouse_move', dx: relX, dy: relY }); relX = relY = 0; }
  }
  const scheduleMove = () => { if (!moveFrame) moveFrame = requestAnimationFrame(flushMove); };
  const BUTTONS = ['left', 'middle', 'right', 'back', 'forward'];

  img.addEventListener('mousemove', e => {
    if (!inp || !inp.enabled || mode !== 'ui' || !capturing()) return;
    pendingMove = norm(e); scheduleMove();
  });
  document.addEventListener('mousemove', e => {
    if (!locked()) return;
    relX += e.movementX; relY += e.movementY; scheduleMove();
  });
  img.addEventListener('mousedown', e => {
    if (!inp || !inp.enabled || !wsOpen()) return;
    e.preventDefault();
    main.focus();
    if (mode === 'game') {
      if (!locked()) {
        const p = main.requestPointerLock({ unadjustedMovement: true });
        if (p && p.catch) p.catch(() => main.requestPointerLock());
        return;
      }
    } else {
      pendingMove = norm(e); flushMove();
    }
    const b = BUTTONS[e.button]; if (!b) return;
    heldButtons.add(b); send({ type: 'mouse_button', button: b, down: true });
  });
  main.addEventListener('mousedown', e => { if (locked() && e.target !== img) { const b = BUTTONS[e.button]; if (b) { heldButtons.add(b); send({ type: 'mouse_button', button: b, down: true }); } } });
  window.addEventListener('mouseup', e => {
    const b = BUTTONS[e.button];
    if (b && heldButtons.delete(b)) { flushMove(); send({ type: 'mouse_button', button: b, down: false }); }
  });
  img.addEventListener('contextmenu', e => { if (inp && inp.enabled) e.preventDefault(); });
  img.addEventListener('dragstart', e => { if (inp && inp.enabled) e.preventDefault(); });
  main.addEventListener('wheel', e => {
    if (!capturing()) return;
    e.preventDefault();
    wheelAcc += e.deltaMode === 1 ? e.deltaY / 3 : e.deltaMode === 2 ? e.deltaY : e.deltaY / 100;
    const n = Math.trunc(wheelAcc);
    if (n) { wheelAcc -= n; send({ type: 'wheel', dx: 0, dy: Math.max(-20, Math.min(20, n)) }); }
  }, { passive: false });
  document.addEventListener('pointerlockchange', () => { if (!locked()) releaseAll(); updateCapture(); });

  document.addEventListener('keydown', e => {
    if (!capturing()) return;
    // The browser itself uses Escape to leave pointer lock.
    if (locked() && e.code === 'Escape') return;
    e.preventDefault(); e.stopImmediatePropagation();
    if (e.repeat || !e.code || heldKeys.has(e.code)) return;
    heldKeys.add(e.code); send({ type: 'key', key: e.code, down: true });
  }, true);
  document.addEventListener('keyup', e => {
    if (!heldKeys.has(e.code)) return;
    e.preventDefault();
    heldKeys.delete(e.code); send({ type: 'key', key: e.code, down: false });
  }, true);

  // Gamepad API, standard mapping: 0-3 A/B/X/Y, 4/5 bumpers, 6/7 triggers, 8/9 back/start,
  // 10/11 stick clicks, 12-15 d-pad, 16 guide.
  const NEUTRAL_PAD = { buttons: { a: false, b: false, x: false, y: false, lb: false, rb: false, back: false, start: false, ls: false, rs: false, guide: false }, axes: { lx: 0, ly: 0, rx: 0, ry: 0, lt: 0, rt: 0 }, hat: [0, 0] };
  const PAD_NAMES = ['a', 'b', 'x', 'y', 'lb', 'rb', null, null, 'back', 'start', 'ls', 'rs'];
  let padTimer = null, padSent = null, padSentAt = 0;
  function readPad() {
    const pad = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(p => p && p.connected && p.mapping === 'standard');
    if (!pad) return null;
    const b = i => !!(pad.buttons[i] && pad.buttons[i].pressed), v = i => pad.buttons[i] ? +pad.buttons[i].value.toFixed(3) : 0;
    const dz = x => Math.abs(x) < 0.06 ? 0 : +x.toFixed(3);
    const buttons = {}; PAD_NAMES.forEach((n, i) => { if (n) buttons[n] = b(i); }); buttons.guide = b(16);
    return { buttons, axes: { lx: dz(pad.axes[0] || 0), ly: dz(pad.axes[1] || 0), rx: dz(pad.axes[2] || 0), ry: dz(pad.axes[3] || 0), lt: v(6), rt: v(7) },
             hat: [(b(15) ? 1 : 0) - (b(14) ? 1 : 0), (b(13) ? 1 : 0) - (b(12) ? 1 : 0)] };
  }
  function pollPad() {
    const st = readPad();
    el('pad-ind').hidden = !st;
    if (!st) { clearInterval(padTimer); padTimer = null; return; }
    if (!inp || !inp.enabled || !wsOpen() || !document.hasFocus()) {
      if (padSent) { send({ type: 'gamepad', ...NEUTRAL_PAD }); padSent = null; }
      return;
    }
    const json = JSON.stringify(st), now = performance.now();
    // Resend now and then so the server does not retire the pad while a stick is held still.
    if (json !== padSent || now - padSentAt > 10000) { send({ type: 'gamepad', ...st }); padSent = json; padSentAt = now; }
  }
  const startPad = () => { if (!padTimer) padTimer = setInterval(pollPad, 16); pollPad(); };
  window.addEventListener('gamepadconnected', startPad);
  window.addEventListener('gamepaddisconnected', () => { if (padSent) { send({ type: 'gamepad', ...NEUTRAL_PAD }); padSent = null; } pollPad(); });

  loadInput();
  setInterval(() => { if (!document.hidden) loadInput(); }, 5000);
  loadSettings();
  run();
})();
</script>
</body>
</html>
